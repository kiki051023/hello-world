server:
  port: 8080

spring:
  application:
    name: student-management

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/student_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.example.student.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  # 无回退默认值：必须由环境变量/JVM 参数注入，JwtSecretGuard 启动时校验
  secret: ${JWT_SECRET:${jwt.secret:}}
  access-expire: ${JWT_ACCESS_EXPIRE:1800000}
  refresh-expire: ${JWT_REFRESH_EXPIRE:604800000}

knife4j:
  enable: true
  openapi:
    title: 学生管理系统 API
    description: 学生管理系统接口文档
    version: 1.0.0
    group:
      default:
        group-name: 默认
        api-rule: package
        api-rule-resources:
          - com.example.student.controller
