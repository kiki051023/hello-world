server:
  port: 8080

spring:
  application:
    name: student-management

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/student_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: "123456"

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.example.student.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: student-management-system-secret-key-2024
  expire: 86400000

knife4j:
  enable: true
  openapi:
    title: 学生管理系统 API
    description: 学生管理系统接口文档
    version: 1.0.0
    group:
      default:
        group-name: 默认
        api-rule: package
        api-rule-resources:
          - com.example.student.controller
